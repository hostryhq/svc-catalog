entity: outlet_power_profile
entity_v: 1
owner: catalog
stream: outlet
policy: lww
tombstone: true
id:
  rule: uuidv5
  name: outlet_power_profile|{outlet_id}|{component}
description: Power backup of the router and the hub PC, so set-up can warn the printed fallback will not exist in
  a cut (ADR-0014 A1.6 item 5).
fields:
  component:
    type: enum
    values:
    - router
    - hub_pc
    required: true
    policy: immutable
    description: router or hub_pc.
  power_backup:
    type: enum
    values:
    - none
    - ups
    - inverter
    required: true
    policy: lww
    description: Backup.
  backup_minutes:
    type: int
    required: false
    policy: lww
    minimum: 0
    description: Minutes of backup, if known.
written_by_intents:
- settings.outlet.edit
