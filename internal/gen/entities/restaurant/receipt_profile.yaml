  address:
    type: string
    required: true
    policy: lww
    max_length: 200
    description: Address, up to 3 lines separated by newline.
  phone:
    type: string
    required: false
    policy: lww
    max_length: 20
    description: Outlet phone.
  footer_text:
    type: string
    required: false
    policy: lww
    max_length: 120
    description: Invoice footer.
  upi_id:
    type: string
    required: false
    policy: lww
    max_length: 60
    description: Static UPI id for the footer QR (Should); verifies nothing.
written_by_intents:
- settings.outlet.edit
