  name: receipt_profile|{outlet_id}
description: 'Printed outlet details and footer. One row per outlet. Legal name and GSTIN come from the tax registration.
  x-provisional: RM-T2 lists address under the strong GST profile; here it is a normal outlet setting.'
fields:
  trade_name:
    type: string
    required: false
    policy: lww
    max_length: 60
